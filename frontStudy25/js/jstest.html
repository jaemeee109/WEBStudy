<!-- 1~100까지 전체 합, 홀수합, 짝수합 구하기 -->
<script>
	var sum=0, even=0, odd=0;
	for(var i=1; i<=100; i++) {
		sum += i;
		switch(i%2){
		case 0 : even+=i; break;
		case 1 : odd+=i; break;
		}
	}
	document.write("1~100까지의 전체 합 "+ sum +"<br>");
	document.write("1~100까지의 홀수 합 "+ odd + "<br>");
	document.write("1~100까지의 짝수 합 "+ even + "<br>");
</script>
<!-- break 와 continue -->
<script>
	for(var i=1; i<=10; i++)
		{
		if(i==5)
			break;
		document.write(i+"&nbsp;&nbsp;")
		}
	document.write("<br><br>");
	
	for (var j=1; j<=10; j++){
		if(j==5)
			continue;
		document.write(j+"&nbsp;&nbsp;")
	}
</script>

<script>
	function plusfunc(){
		var a = parseInt (frm.a.value);
		var b = parseInt (frm.b.value);
		
		if (isNaN(a) || isNaN(b)){
			alert("a값 또는 b값은 숫자가 아닙니다")
			frm.a.value="";
			frm.b.value="";
			frm.a.focus();
			return;
		}
		frm.rs.value = a+b;
	}
	function divifunc(){
		var a = Number(frm.a.value);
		var b = Number(frm.b.value);
		rs=a/b;
		
		if(isFinite(rs)==false){
			alert("0으로 나눌 수 없습니다");
			frm.a.value="";
			frm.b.value="";
			frm.a.focus();
			return;
		}
		frm.rs.value=rs;
	}
</script>
<body>
	<form name = "frm"">
	A값: <input type ="text" size="7" name="a">&nbsp; &nbsp;
	B값: <input type ="text" size="7" name="b">&nbsp; &nbsp;
	결과: <input type ="text" size="7" name="rs">
	<input type ="button" name="+" value="더하기" onclick="plusfunc()">
	<input type ="button" name="/" value="나누기" onclick="divifunc()">
	</form>

<!--  this 사용 -->

<script>
	var User={
			name: 'Bam',
			age: '5',
			view : function() {
				document.write('My name is ' + this.name + "<br>");
				document.write('My age is ' + this.age );
			}
	};
	document.write(typeof User + "<br>");
	User.view();
	
</script>

<!-- 생성자를 이용한 객체생성 -->
<script>
	function User (name,age){
		this.name=name;
		this.age=age;
		this.view=function(){
			document.write('나의 이름은 ' +this.name+ '이고 나이는' +this.age + "세 입니다<br>");
		};
	}
	var ob1=new User('JJK',27);
	var ob2=new User('BBH',33);
	ob1 .view();
	ob2 .view();
</script>

</script>
