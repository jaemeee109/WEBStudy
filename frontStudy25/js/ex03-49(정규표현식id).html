<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title> 정규 표현식 (아이디) </title>
</head>
<script>
	function process(){
		var id=document.getElementById("bam91").value;
		var patt=new RegExp("^[a-zA-Z][0-9a-zA-Z]{4,7}$");
		if (patt.test(id)){
			alert("성공");
		}else{
			alert("다시입력");
			document.getElementById("bam91").value="";
			document.getElementById("bam91").focus="";
		}
	}
</script>
<body>
	<label>아이디</label>
	<input type="text" name="bam91" id="bam91">
	<input type="button" value="commit" onclick="process()">
	
</body>
</html>
