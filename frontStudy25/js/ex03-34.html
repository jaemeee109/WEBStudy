<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>사용중인 브라우저의 정보 확인</title>
</head>
<body>
<script>
	document.write("브라우저명: " + navigator.appName + "<br>");
	document.write("코드명: " + navigator.appCodeName + "<br>");
	document.write("운영체제: " + navigator.platform + "<br>");
	document.write("사용언어: " + navigator.language + "<br>");
	document.write("사용엔진: " + navigator.product + "<br>");
</script>
</body>
</html>
