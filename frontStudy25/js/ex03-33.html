<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>객체를 이용해서 지정파일 데이터 전송</title>
</head>
<script>
	function process(){
		var name=frm.name.value;
		var phone=frm.phone.value;
		location.href="ex03-33(win).html?"+name+"&"+phone;
	}
</script>
<body>
	<form name ="frm">
		사용자명: <input type="text" name = "name">
		전화번호: <input type="text" name = "phone">
		<input type= "button" onclick="process()" value="보내기">
			</form>
</body>
</html>
